  function runAct(g, dt, now){
    const a = g.act, t = (now - a.t0)/1000, p = a.dur ? clamp((now - a.t0)/a.dur, 0, 1) : 0, S = g.s*2.4;
    switch(a.name){
      case 'dance': {
        const w = Math.sin(t*Math.PI*2.6);
        g.pose.armL = (90 + w*60)*DEG; g.pose.armR = (-90 + w*60)*DEG; g.pose.legL = w*10*DEG; g.pose.legR = w*10*DEG;
        g.rot = w*0.08; g.bob = -Math.abs(Math.sin(t*Math.PI*2.6))*14*S; g.pose.head = w*6*DEG; g.sx = 1;
        if(!a.s1){ a.s1 = true; girlSound('giggle', g.x, 0.6); }
        break;
      }
      case 'jump': {
        idlePose(g); g.rot = 0; let b = 0, arms = 20, leg = 0;
        if(p < 0.2) b = Math.sin(p/0.2*Math.PI/2)*10*S;
        else if(p < 0.85){ const q = (p - 0.2)/0.65; b = -Math.sin(q*Math.PI)*95*S; arms = 150; leg = 8; }
        else b = Math.sin((p - 0.85)/0.15*Math.PI)*6*S;
        g.bob = b; g.pose.armL = arms*DEG; g.pose.armR = -arms*DEG; g.pose.legL = leg*DEG; g.pose.legR = -leg*DEG;
        if(!a.s1 && p > 0.2){ a.s1 = true; girlSound('giggle', g.x, 0.6); }
        if(!a.s2 && p > 0.85){ a.s2 = true; thump(0.3); }
        break;
      }
      case 'spin': {
        idlePose(g);
        const e = p*p*(3 - 2*p), c = Math.cos(e*2*Math.PI*2);
        g.sx = (c < 0 ? -1 : 1) * Math.max(0.08, Math.abs(c));
        g.pose.armL = 60*DEG; g.pose.armR = -60*DEG; g.bob = -Math.sin(p*Math.PI)*10*S;
        if(!a.s1){ a.s1 = true; girlSound('giggle', g.x, 0.7); }
        break;
      }
      case 'clap': {
        idlePose(g); g.rot = 0;
        const c = (t % 0.45)/0.45, k = Math.floor(t/0.45), closed = Math.sin(c*Math.PI);
        g.pose.armL = (10 - closed*42)*DEG; g.pose.armR = (-10 + closed*42)*DEG;
        if(c > 0.45 && a.k !== k && k < 4){ a.k = k; girlSound('clap', g.x, 1); }
        break;
      }
      case 'wave': {
        idlePose(g); const w = Math.sin(t*11);
        g.pose.armR = (-150 + w*22)*DEG; g.pose.head = 5*DEG;
        if(!a.s1){ a.s1 = true; girlSound('giggle', g.x, 0.7); }
        break;
      }
      case 'laugh': {
        idlePose(g); const h = Math.abs(Math.sin(t*Math.PI*2.4));
        g.bob = -h*18*g.s*2; g.pose.armL = (30 + 40*h)*DEG; g.pose.armR = (-30 - 40*h)*DEG; g.rot = Math.sin(t*9)*0.04;
        if(!a.s1){ a.s1 = true; girlSound('laugh', g.x, 0.9); }
        break;
      }
      case 'peek': {
        // no bush nearby: crouch with hands over the head, then pop up laughing
        idlePose(g); g.rot = 0;
        if(p < 0.55){ const q = Math.min(1, p/0.12); g.bob = q*22*S; g.pose.armL = 160*DEG*q; g.pose.armR = -160*DEG*q; g.pose.head = 0; }
        else { const q = (p - 0.55)/0.45; g.bob = -Math.sin(Math.min(1, q*2)*Math.PI)*40*S; g.pose.armL = (160 - 120*Math.min(1, q*3))*DEG; g.pose.armR = -g.pose.armL;
          if(!a.s1){ a.s1 = true; girlSound('laugh', g.x, 0.9); } }
        break;
      }
      case 'hide': {
        if(a.phase === 'go'){
          if(walkTo(g, dt, 175) || now - a.t0 > 5000){ a.phase = 'down'; a.t1 = now; idlePose(g); }
          else walkPose(g);
          break;
        }
        idlePose(g); g.rot = 0;
        const u = (now - a.t1)/1000;
        if(u < 0.45) g.sink = u/0.45*0.86;
        else if(u < 1.9) g.sink = 0.86;
        else if(u < 2.4) g.sink = 0.86 - (u - 1.9)/0.5*0.3;
        else if(u < 3.6){ g.sink = 0.56; g.pose.head = Math.sin(u*8)*6*DEG; if(!a.s1){ a.s1 = true; girlSound('laugh', g.x, 0.9); } }
        else if(u < 4.0) g.sink = 0.56*(1 - (u - 3.6)/0.4);
        else { g.sink = 0; g.act = null; }
        return;
      }
      case 'visit': {
        const an = a.an;
        if(!animals.includes(an)){ g.act = null; idlePose(g); return; }
        if(a.phase === 'go'){
          if(now > a.aimAt){
            a.aimAt = now + 400;
            const ground = (!an.def.flyer || an.ground) && an.mode !== 'air' && an.mode !== 'fly';
            let tx, ty;
            const both = ctrl.who === 'both', extra = both && g.idx === 1 ? g.meta.width*girlScale(g)*1.15 : 0;
            if(ground){
              if(a.side === undefined) a.side = g.x < an.x ? -1 : 1;
              const half = Math.min(an.def.size[0], an.def.height*1.5)*0.42*an.s;
              tx = an.x + a.side*(half + 60*depthScale(an.y) + extra); ty = an.y;
            } else { tx = an.x + (both ? (g.idx ? 1 : -1)*g.meta.width*girlScale(g)*0.6 : 0); ty = Math.max(an.y + 240, polyInfo().yMin + 30); }
            [g.tx, g.ty] = nearestInPoly(tx, ty);
            if(!an.def.flyer && an.mode === 'walk' && Math.hypot(g.x - an.x, g.y - an.y) < 450){ an.mode = 'idle'; an.idleUntil = now + 5000; }
          }
          if(walkTo(g, dt, 165) || now - a.t0 > 9000){
            a.phase = 'wave'; a.t1 = now;
            if(!an.greetedAt || now - an.greetedAt > 1500){ an.greetedAt = now; animalRespond(an, now); }
            if(!an.def.flyer && an.beh !== 'hopper' && (an.mode === 'walk' || an.mode === 'idle')){ an.mode = 'idle'; an.idleUntil = Math.max(an.idleUntil || 0, now + 3500); }
            girlSound('giggle', g.x, 0.7);
          }
          else walkPose(g);
          return;
        }
        const u = (now - a.t1)/1000, w = Math.sin(u*11);
        idlePose(g);
        if(an.x >= g.x) g.pose.armR = (-150 + w*22)*DEG; else g.pose.armL = (150 + w*22)*DEG;
        if(u > 2.4) g.act = null;
        return;
      }
    }
    if(a.dur && now - a.t0 >= a.dur){ g.act = null; g.sx = 1; g.bob = 0; }
  }
  /* an animal answers a girl that came to say hello */
  function animalRespond(an, now){
    soundBusyUntil = 0;
    switch(an.kind){
      case 'elephant': case 'tiger': case 'snake': case 'frog':
        if(an.mode !== 'air' && an.mode !== 'hop'){ an.act = null; trySpecial(an, now); }
        break;
      case 'turtle': an.act = { type: 'hide', start: now, end: now + 3500 }; break;
      case 'chameleon': if(an.mode === 'walk' || an.mode === 'idle'){ an.mode = 'look'; an.seqStart = now; } break;
      case 'butterfly': animalSound('butterfly', an.x); if(an.mode === 'rest') an.restUntil = now; break;
      default: if(an.def.flyer && an.mode !== 'fly') startAct(an, 'call', 900, pick(an.def.sounds));
    }
  }

  /* ---------- during a video the girls stand on both sides of it ---------- */
  function girlsToVideo(){
    if(girls.length < 2) return;
    const R = VIDEO_RECT, [A, B] = girls;
    for(const g of girls) resetGirl(g);
    const wA = A.meta.width * cfg.girlSize * A.ratio / A.meta.height, wB = B.meta.width * cfg.girlSize * B.ratio / B.meta.height;
    A.tx = R.x - 26 - wA*0.62; A.ty = R.y + R.h + 70;
    B.tx = R.x + R.w + 26 + wB*0.62; B.ty = R.y + R.h + 70;
    ctrl.duoAct = null; duo.ball = null; duo.mode = 'tovideo'; duo.nextFun = performance.now() + rand(9000, 16000);
  }
  function updateVideoGirls(dt, now){
    const [A, B] = girls;
    if(duo.mode === 'tovideo'){
      const a = walkTo(A, dt, 150), b = walkTo(B, dt, 150);
      for(const g of girls){ if(Math.hypot(g.tx - g.x, g.ty - g.y) > 3) walkPose(g); else idlePose(g); }
      if(a && b) duo.mode = 'video';
      return;
    }
    for(const g of girls){ idlePose(g); g.rot *= 0.5; }
    if(now > duo.nextFun){
      duo.nextFun = now + rand(12000, 22000);
      const g = pick(girls);
      g.act = Math.random() < 0.6 ? { name: 'clapsoft', t0: now, dur: 1800 } : { name: 'bounce', t0: now, dur: 1400 };
    }
    for(const g of girls){
      const a = g.act; if(!a) continue;
      const t = (now - a.t0)/1000;
      if(a.name === 'clapsoft'){
        const c = (t % 0.45)/0.45, k = Math.floor(t/0.45), closed = Math.sin(c*Math.PI);
        g.pose.armL = (10 - closed*42)*DEG; g.pose.armR = (-10 + closed*42)*DEG;
        if(c > 0.45 && a.k !== k && k < 4){ a.k = k; girlSound('clap', g.x, 0.35); }
      } else if(a.name === 'bounce'){
        const h = Math.abs(Math.sin(t*Math.PI*2.4)); g.bob = -h*12*g.s*2; g.pose.armL = (30 + 30*h)*DEG; g.pose.armR = (-30 - 30*h)*DEG;
      }
      if(now - a.t0 > a.dur){ g.act = null; g.bob = 0; }
    }
  }

  function drawGirl(g){
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${(0.18*(1 - g.sink)).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(g.x, g.y + 3, g.meta.width*0.42*g.s*Math.max(0.3, Math.abs(g.sx)), 10*g.s*2.4, 0, 0, Math.PI*2); ctx.fill();
    if(g.sink > 0){ ctx.beginPath(); ctx.rect(g.x - 600, g.y - 3000, 1200, 3000 + 4); ctx.clip(); }
    ctx.translate(g.x, g.y + g.bob + g.sink*g.meta.height*g.s);
    ctx.rotate(g.rot);
    ctx.scale(g.s*g.sx, g.s);
    ctx.translate(-g.meta.anchor[0], -g.meta.anchor[1]);
    const pose = { armL: { r: g.pose.armL }, armR: { r: g.pose.armR }, legL: { r: g.pose.legL }, legR: { r: g.pose.legR }, head: { r: g.pose.head } };
    Figure.drawBaked(ctx, g.def, g.baked, pose);
    ctx.restore();
  }
  function drawBall(b){
    ctx.save();
    ctx.shadowColor = 'rgba(20,15,5,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.spin);
    const cols = ['#E2342B','#FBD130','#2457C5','#2E8B3E'];
    for(let i=0;i<4;i++){ ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,b.r, i*Math.PI/2, (i+1)*Math.PI/2); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = '#1B1F1A'; ctx.lineWidth = Math.max(2, b.r*0.15); ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  /* ---------- rain every 15 minutes ---------- */
  const RAIN_EVERY = 15*60*1000, RAIN_LEN = 90000;
  function startRain(now){ if(rain.active) return; rain.active = true; rain.t0 = now; rain.next = now + RAIN_EVERY; }
  function newDrop(initial){
    return { x: rand(-260, W + 40), y: initial ? rand(-H, H) : rand(-160, -20), v: rand(1150, 1550), len: rand(24, 42), end: rand(560, H + 20), a: rand(0.22, 0.5), w: rand(1.2, 2.4) };
  }
  function updateRain(dt, now){
    if(!rain.active && rain.next && now > rain.next) startRain(now);
    if(rain.active){
      const u = (now - rain.t0)/RAIN_LEN;
      rain.k = u < 0.17 ? u/0.17 : u > 0.83 ? Math.max(0, (1 - u)/0.17) : 1;
      if(u >= 1){ rain.active = false; rain.k = 0; }
    }
    const want = Math.round(460 * rain.k);
    const P = polyInfo().p;
    for(let i = rain.drops.length - 1; i >= 0; i--){
      const d = rain.drops[i];
      d.y += d.v*dt; d.x += d.v*0.17*dt;
      if(d.y > d.end){
        if(Math.random() < 0.35 && inPoly(d.x, d.end, P)) rain.rings.push({ x: d.x, y: d.end, age: 0, life: rand(0.35, 0.6), r: rand(6, 12) * depthScale(d.end) });
        if(rain.drops.length > want) rain.drops.splice(i, 1); else rain.drops[i] = newDrop(false);
      }
    }
    while(rain.drops.length < want) rain.drops.push(newDrop(rain.drops.length < want*0.5 && rain.k > 0.9));
    for(const r of rain.rings) r.age += dt;
    rain.rings = rain.rings.filter(r => r.age < r.life);
  }
  function drawRain(){
    if(rain.k <= 0 && !rain.drops.length && !rain.rings.length) return;
    ctx.save();
    if(rain.k > 0){ ctx.fillStyle = `rgba(8,16,34,${(0.32*rain.k).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.strokeStyle = 'rgba(205,222,255,1)'; ctx.lineCap = 'round';
    for(const band of [[0.22, 0.32, 1.3], [0.32, 0.42, 1.7], [0.42, 0.6, 2.2]]){
      ctx.globalAlpha = (band[0] + band[1])/2; ctx.lineWidth = band[2]; ctx.beginPath();
      for(const d of rain.drops){ if(d.a < band[0] || d.a >= band[1]) continue; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len*0.17, d.y - d.len); }
      ctx.stroke();
    }
    ctx.lineWidth = 1.4;
    for(const r of rain.rings){
      const q = r.age/r.life; ctx.globalAlpha = 0.45*(1 - q);
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r*(0.4 + q*1.6), r.r*(0.4 + q*1.6)*0.32, 0, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- videos in the middle of the forest ---------- */
  const VIDEO_RECT = { x: 480, y: 238, w: 960, h: 540 };
  function startVideo(file){
    if(video.el) killVideo();
    initAudio();
    const el = document.createElement('video');
    el.preload = 'auto'; el.playsInline = true; el.src = 'media/videos/' + encodeURIComponent(file);
    if(ac){ try { const src = ac.createMediaElementSource(el), g = ac.createGain(); g.gain.value = 1; src.connect(g).connect(master); } catch(_) {} }
    el.addEventListener('ended', () => stopVideo(true));
    el.addEventListener('error', () => stopVideo(true));
    el.play().catch(() => { el.muted = true; el.play().catch(() => stopVideo(true)); });
    video.el = el; video.file = file; video.active = true; video.fading = false;
    setAmbienceLevel();
    if(duo.mode === 'ctrl' || autoMode() || duo.mode === 'shelter' || duo.mode === 'video' || duo.mode === 'tovideo') girlsToVideo();
  }
  function stopVideo(natural){
    if(!video.active) return;
    video.active = false; video.fading = true;
    if(natural) fetch('/api/video/ended', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    if(duo.mode === 'tovideo' || duo.mode === 'video') sendHome();
    setAmbienceLevel();
  }
  function killVideo(){
    const el = video.el; if(!el) return;
    try { el.pause(); el.removeAttribute('src'); el.load(); } catch(_) {}
    video.el = null; video.alpha = 0; video.fading = false;
  }
  function updateVideo(dt){
    if(video.active) video.alpha = Math.min(1, video.alpha + dt/0.6);
    else if(video.fading){
      video.alpha = Math.max(0, video.alpha - dt/0.5);
      if(video.alpha <= 0){ killVideo(); releaseHeld(); }
    }
  }
  function roundRectPath(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawVideo(){
    const el = video.el; if(!el || video.alpha <= 0) return;
    const R = VIDEO_RECT, e = video.alpha, k = 0.9 + 0.1*(1 - Math.pow(1 - e, 3)), cx = R.x + R.w/2, cy = R.y + R.h/2;
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
    ctx.fillStyle = '#FFFDF8'; roundRectPath(R.x - 16, R.y - 16, R.w + 32, R.h + 32, 20); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0B0F0C'; ctx.fillRect(R.x, R.y, R.w, R.h);
    if(el.readyState >= 2 && el.videoWidth){
      const s = Math.min(R.w/el.videoWidth, R.h/el.videoHeight), vw = el.videoWidth*s, vh = el.videoHeight*s;
      ctx.drawImage(el, R.x + (R.w - vw)/2, R.y + (R.h - vh)/2, vw, vh);
    }
    ctx.restore();
  }

  /* ---------- draw ---------- */
  function poseOf(a){
    const def = a.def;
    let mode = a.mode;
    if(def.flyer) mode = a.mode === 'fly' ? 'fly' : (a.beh === 'monkey' ? 'hang' : 'perch');
    else if(a.beh === 'hopper') mode = a.mode === 'hop' || a.mode === 'air' ? 'hop' : 'sit';
    else if(mode !== 'walk' && mode !== 'air') mode = 'idle';
    const st = { mode, phase: a.phase, time: a.time, seed: a.seed, look: a.look, tongue: a.tongue, call: 0 };
    if(a.act){
      const p = actProgress(a);
      if(a.act.type === 'call') st.call = bell(p, 0.15, 0.25);
      else if(a.act.type === 'yawn'){ st.yawn = bell(p, 0.35, 0.35); st.crouch = bell(p, 0.2, 0.2); }
      else if(a.act.type === 'hide') st.hide = bell(p, 0.12, 0.2);
      else if(a.act.type === 'croak') st.call = Math.abs(Math.sin(p*Math.PI*3));
      else if(a.act.type === 'hiss'){ st.call = bell(p, 0.15, 0.2); st.tongue = Math.max(0, Math.sin(p*Math.PI*6)); }
    }
    if(a.kind === 'snake' && !st.tongue){ st.tongue = 0; }
    return def.pose(st);
  }

  function drawAnimal(a){
    const def = a.def, pose = poseOf(a), sq = a.squash, sx = 1 + 0.07*sq, sy = 1 - 0.09*sq;
    const onGround = (!def.flyer || a.ground) && !['air','lift','fly','hop'].includes(a.mode);
    ctx.save();
    if(onGround || a.mode === 'hop'){
      const gy = a.mode === 'hop' ? a.hopGround : a.y;
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.beginPath(); ctx.ellipse(a.x, gy + 3, Math.min(def.size[0], def.height*1.5)*0.42*a.s, 9*a.s, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.scale(a.s*a.dir*sx, a.s*sy);
    ctx.translate(-def.anchor[0], -def.anchor[1]);
    Figure.drawBaked(ctx, def, a.baked, pose);
    ctx.restore();
    if(a.photo && a.mode !== 'lift') drawBadge(a);
  }

  function drawBadge(a){
    const def = a.def, [ax, ay] = def.anchor, [bx, by] = def.badge;
    const lx = (bx - ax)*a.s*a.dir, ly = (by - ay)*a.s, c = Math.cos(a.rot), s = Math.sin(a.rot);
    const x = a.x + lx*c - ly*s, y = a.y + lx*s + ly*c + Math.sin(a.time*2.2 + a.seed)*3;
    const r = clamp(def.badgeR * Math.max(a.s, 0.9), 22, 64);
    ctx.save();
    ctx.shadowColor = 'rgba(20,15,5,.38)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(x, y, r + 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip(); ctx.drawImage(a.photo, x - r, y - r, r*2, r*2); ctx.restore();
    ctx.save(); ctx.strokeStyle = '#1B1F1A'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r + 6, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }

  function draw(now){
    const t = now/1000;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.setTransform(sc,0,0,sc,0,0);
    drawSky(t);
    if(bgStatic) ctx.drawImage(bgStatic.can, bgStatic.x, bgStatic.y, bgStatic.w, bgStatic.h);

    const girlsOnTop = video.alpha > 0 || duo.mode === 'tovideo' || duo.mode === 'video';
    const items = els.map(e => ({ y: e.baseY, e }));
    const top = [];
    for(const a of animals){
      const onGround = (!a.def.flyer || a.ground) && a.mode !== 'air' && a.mode !== 'lift' && !(a.def.flyer && a.mode === 'fly');
      if(onGround) items.push({ y: a.mode === 'hop' ? a.hopGround : a.y, a, k: 1 });
      else if(a.beh === 'butterfly' && a.mode === 'rest' && a.spot) items.push({ y: a.spot.el.baseY + 0.5, a, k: 2 });
      else top.push(a);
    }
    if(!girlsOnTop) for(const g of girls) items.push({ y: g.y, g, k: 1 });
    items.sort((p, q) => p.y - q.y || (p.k||0) - (q.k||0));
    for(const it of items){ if(it.e) drawElement(it.e, t); else if(it.g) drawGirl(it.g); else drawAnimal(it.a); }
    if(duo.ball && !girlsOnTop) drawBall(duo.ball);
    for(const a of top) drawAnimal(a);

    for(const p of parts){
      const life = p.age/p.life, alpha = life < 0.6 ? 1 : 1 - (life-0.6)/0.4;
      ctx.globalAlpha = Math.max(0, p.round ? alpha*0.55 : alpha);
      ctx.fillStyle = p.col;
      if(p.round){ ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
      else { const len = p.size*(1.4 + Math.min(2.2, p.vx/400)); ctx.fillRect(p.x - len, p.y - p.size*0.35, len, p.size*0.7); }
    }
    ctx.globalAlpha = 1;
    drawRain();
    drawVideo();
    if(girlsOnTop){ for(const g of girls.slice().sort((p, q) => p.y - q.y)) drawGirl(g); if(duo.ball) drawBall(duo.ball); }
    if(!$('panel').hidden) drawGuides();
  }

  function drawGuides(){
    ctx.save();
    const P = cfg.walk;
    if(P.length){
      ctx.beginPath(); P.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); if(P.length > 2) ctx.closePath();
      ctx.fillStyle = 'rgba(255,200,61,.14)'; if(P.length > 2) ctx.fill();
      ctx.strokeStyle = '#FFC83D'; ctx.lineWidth = 3; ctx.setLineDash([16,10]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#FFC83D'; for(const [x,y] of P){ ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); }
    }
    ctx.font = 'bold 14px Segoe UI, Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    cfg.perches.forEach(([x,y],i) => {
      ctx.fillStyle = '#36B5E8'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(i+1, x, y+1);
    });
    cfg.girls.forEach(([x,y],i) => {
      ctx.fillStyle = '#F06AA0'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(i ? 'B' : 'A', x, y+1);
    });
    const ex = cfg.entryX*W;
    ctx.fillStyle = '#FFC83D'; ctx.beginPath(); ctx.moveTo(ex-30,H-4); ctx.lineTo(ex+30,H-4); ctx.lineTo(ex,H-60); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- incoming drawings ---------- */
  function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
  async function receive(m){
    try{
      const img = await loadImg(m.image);
      const photo = m.photo ? await loadImg(m.photo).catch(() => null) : null;
      setTimeout(() => spawn(m.type, img, photo), cfg.delay);
    }catch(_){}
  }
  function onPlay(m){
    if(girls.length < 2) return;
    if(m.cmd === 'start'){ if(duo.mode !== 'ctrl') startControl(m.who); else ctrl.who = m.who || ctrl.who; }
    else if(m.cmd === 'who'){ if(duo.mode === 'ctrl') ctrl.who = m.who; }
    else if(m.cmd === 'move'){ if(duo.mode === 'ctrl'){ ctrl.vec = { x: Number(m.x) || 0, y: Number(m.y) || 0 }; ctrl.vecAt = performance.now(); } }
    else if(m.cmd === 'action') ctrlAction(m.name, m.target);
    else if(m.cmd === 'end') endControl();
  }
  function connect(){
    const es = new EventSource('/api/events');
    es.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch(_) { return; }
      if(m.kind === 'animal') receive(m);
      else if(m.kind === 'play') onPlay(m);
      else if(m.kind === 'video'){ if(m.cmd === 'play' && m.file) startVideo(m.file); else if(m.cmd === 'stop') stopVideo(false); }
      else if(m.kind === 'phone') hideQR();
    };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }

  /* ---------- start overlay ---------- */
  let phoneUrl = null, phoneSeen = false, qrShown = false;
  fetch('/api/info').then(r=>r.json()).then(i => { phoneUrl = i.phoneUrl || `http://${i.ip}:${i.port}/tablet.html`; phoneSeen = !!i.phoneSeen; $('phoneUrl').textContent = phoneUrl; }).catch(()=>{});
  function showQR(){
    if(qrShown || phoneSeen || !phoneUrl) return;
    qrShown = true;
    try { QR.draw($('qrCan'), phoneUrl, 640); $('qr').hidden = false; } catch(_) {}
  }
  function hideQR(){
    phoneSeen = true;
    const q = $('qr'); if(q.hidden) return;
    q.classList.add('bye'); setTimeout(() => { q.hidden = true; }, 520);
  }
  $('overlay').addEventListener('click', () => {
    $('overlay').hidden = true; initAudio(); showQR();
    const d = document.documentElement; if(d.requestFullscreen) d.requestFullscreen().catch(()=>{});
  });
  if(window.JUNGLE_TV){
    $('overlay').hidden = true; $('gear').hidden = true; initAudio();
    const tryQR = () => { if(phoneUrl) showQR(); else setTimeout(tryQR, 300); }; tryQR();
    const wake = () => { if(ac && ac.state === 'suspended') ac.resume().catch(()=>{}); };
    addEventListener('keydown', wake); addEventListener('pointerdown', wake); setInterval(wake, 3000);
  }

  /* ---------- settings ---------- */
  function syncUI(){
    $('size').value = cfg.size; $('vSize').textContent = cfg.size + ' px';
    $('girl').value = cfg.girlSize; $('vGirl').textContent = cfg.girlSize + ' px';
    $('entry').value = Math.round(cfg.entryX*100); $('vEntry').textContent = Math.round(cfg.entryX*100) + '%';
    $('delay').value = cfg.delay; $('vDelay').textContent = cfg.delay + ' ms';
    $('amb').value = Math.round(cfg.ambience*100); $('vAmb').textContent = Math.round(cfg.ambience*100) + '%';
  }
  $('size').addEventListener('input', () => { cfg.size = Number($('size').value); syncUI(); });
  $('girl').addEventListener('input', () => { cfg.girlSize = Number($('girl').value); syncUI(); });
  $('entry').addEventListener('input', () => { cfg.entryX = Number($('entry').value)/100; syncUI(); });
  $('delay').addEventListener('input', () => { cfg.delay = Number($('delay').value); syncUI(); });
  $('amb').addEventListener('input', () => { cfg.ambience = Number($('amb').value)/100; syncUI(); setAmbienceLevel(); });

  let editing = null, girlClicks = 0;
  const HINTS = { walk: 'Click around the grass to draw the walking area, point by point.',
    perch: 'Click on top of the branches where the birds and the monkey can stay.',
    girls: 'Click where girl A rests, then where girl B rests.' };
  function setEditing(mode){
    editing = editing === mode ? null : mode;
    $('editWalk').classList.toggle('active', editing === 'walk'); $('editWalk').textContent = editing === 'walk' ? 'Done' : 'Edit';
    $('editPerch').classList.toggle('active', editing === 'perch'); $('editPerch').textContent = editing === 'perch' ? 'Done' : 'Edit';
    $('editGirls').classList.toggle('active', editing === 'girls'); $('editGirls').textContent = editing === 'girls' ? 'Cancel' : 'Set places';
    girlClicks = 0;
    cv.classList.toggle('editing', !!editing);
    $('hint').hidden = !editing; $('hint').textContent = editing ? HINTS[editing] : '';
  }
  $('editWalk').addEventListener('click', () => setEditing('walk'));
  $('editPerch').addEventListener('click', () => setEditing('perch'));
  $('editGirls').addEventListener('click', () => setEditing('girls'));
  $('undoWalk').addEventListener('click', () => cfg.walk.pop());
  $('clearWalk').addEventListener('click', () => { cfg.walk = []; if(editing !== 'walk') setEditing('walk'); });
  $('undoPerch').addEventListener('click', () => cfg.perches.pop());
  $('clearPerch').addEventListener('click', () => { cfg.perches = []; perchTaken.clear(); if(editing !== 'perch') setEditing('perch'); });
  cv.addEventListener('click', e => {
    if(!editing) return;
    const r = cv.getBoundingClientRect();
    const p = [Math.round((e.clientX - r.left)/r.width*W), Math.round((e.clientY - r.top)/r.height*H)];
    if(editing === 'walk') cfg.walk.push(p);
    else if(editing === 'perch') cfg.perches.push(p);
    else if(editing === 'girls'){
      cfg.girls[girlClicks] = p;
      if(girls[girlClicks]){ girls[girlClicks].x = girls[girlClicks].tx = p[0]; girls[girlClicks].y = girls[girlClicks].ty = p[1]; }
      girlClicks++;
      if(girlClicks >= 2){ duo.mode = 'rest'; duo.until = performance.now() + 1500; setEditing('girls'); }
    }
  });
  $('gear').addEventListener('click', () => { $('panel').hidden = !$('panel').hidden; if($('panel').hidden && editing) setEditing(editing); });
  for(const id of ANIMAL_ORDER){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = ANIMALS[id].name;
    b.addEventListener('click', () => { initAudio(); spawn(id, Figure.randomLayer(ANIMALS[id]), null); });
    $('testBtns').appendChild(b);
  }
  $('stormNow').addEventListener('click', () => { initAudio(); if(animals.length) startStorm(); });
  $('nextGame').addEventListener('click', () => { initAudio(); if(girls.length === 2 && autoMode()){ startApproach(performance.now()); } });
  $('rainNow').addEventListener('click', () => { if(rain.active) rain.t0 = Math.min(rain.t0, performance.now() - RAIN_LEN*0.83); else startRain(performance.now()); });
  $('meteorNow').addEventListener('click', () => { nextMeteor = 0; meteor = null; });
  $('save').addEventListener('click', () => {
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)})
      .then(r => r.ok ? ($('status').textContent = 'Saved') : Promise.reject())
      .catch(() => { $('status').textContent = 'Not saved. Make sure the program window is still open.'; });
  });

  /* ---------- boot ---------- */
  fetch('/api/config').then(r=>r.json()).catch(() => null).then(c => {
    if(c && c.v === CFG_VERSION) Object.assign(cfg, c);
    syncUI();
    loadBackground().catch(() => { $('loading').textContent = 'Background not found: put background.svg in the media folder'; });
    loadGirls().catch(() => {});
    connect();
    rain.next = performance.now() + RAIN_EVERY;
    reportScene();
    requestAnimationFrame(frame);
  });

  window.__jungle = { spawnTest: k => spawn(k||'elephant', Figure.randomLayer(ANIMALS[k||'elephant']), null),
    storm: startStorm, count: () => animals.length, parts: () => parts.length, ready: () => bgReady && girls.length === 2,
    animals: () => animals.map(a => ({k:a.kind, m:a.mode, act: a.act && a.act.type, x:Math.round(a.x), y:Math.round(a.y)})),
    duo: () => ({ mode: duo.mode, game: duo.game, who: ctrl.who, girls: girls.map(g => ({ x: Math.round(g.x), y: Math.round(g.y), act: g.act && g.act.name, sink: +g.sink.toFixed(2) })) }),
    game: g => startApproach(performance.now(), g), rain: () => startRain(performance.now()), rainK: () => rain.k,
    stars: () => stars.length, meteors: () => meteorSprites.length, meteor: () => { nextMeteor = 0; meteor = null; },
    play: m => onPlay(m), video: () => ({ active: video.active, alpha: video.alpha, held: held.length }), spots: () => ({ shelter: shelterSpots.length, hide: hideSpots.length }) };
})();
</script>
</body>
</html>
